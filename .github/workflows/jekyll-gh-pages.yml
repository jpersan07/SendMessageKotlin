# Construye con Jekyll la carpeta documentation/ y la publica en GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Se ejecuta cuando termina el flujo que genera la documentación con Dokka
  workflow_run:
    workflows: ["Desplegar Dokka en GitHub Pages"]
    types: [completed]
  # Permite lanzarlo a mano desde la pestaña Actions (usa la documentación del repositorio)
  workflow_dispatch:

# Permisos necesarios para descargar el artefacto de Dokka y publicar en GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Solo un despliegue a la vez; no se cancela el que esté en curso
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Solo publica si Dokka terminó bien (o si se lanza a mano)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar la documentación generada por Dokka
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: documentacion-dokka
          path: documentation
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./documentation
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
